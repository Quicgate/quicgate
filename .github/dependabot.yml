version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Keeps the digest-pinned build image in the Dockerfile current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
