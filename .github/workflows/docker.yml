name: Build and publish image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write     # keyless signing of the build provenance
  attestations: write # publish the provenance attestation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify the pinned toolchain
        run: |
          want="$(awk '/^toolchain /{print $2}' go.mod)"
          got="$(go env GOVERSION)"
          echo "go.mod toolchain: $want, runner: $got"
          test -n "$want" && test "$got" = "$want"
      - run: go vet ./...
      - run: go test -race ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Symbol-level scan against the same toolchain the release is built
      # with: fails on any vulnerability the code can actually reach.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...

  build:
    needs: [test, vulncheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so `git describe` can stamp the version

      - name: Compute version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/quicgate/quicgate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=quicgate
            org.opencontainers.image.description=Single-binary reverse proxy manager: NPM's workflow, native Go engine, HTTP/3, typed config
            org.opencontainers.image.licenses=MIT

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed build provenance for the pushed image digest, verifiable with
      # `gh attestation verify oci://ghcr.io/quicgate/quicgate:<tag> --owner Quicgate`.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/quicgate/quicgate
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
