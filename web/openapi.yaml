openapi: 3.0.3
info:
  title: quicgate management API
  version: "1.0"
  description: >
    Management API for quicgate, served on the admin port (default :81).
    Authenticate with a session cookie (via /api/login) or an API bearer token.
servers:
  - url: /
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: qg_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token from POST /api/tokens (Authorization: Bearer qg_...)."
  schemas:
    VPNSubject:
      type: object
      description: Who a VPN rule, a policy or an enrolment is about. A group or a person always names its identity provider.
      properties:
        kind: { type: string, enum: [any, site, device, peer, user, group, any-user] }
        peer: { type: string, description: "kind peer: site:<id> or device:<id>" }
        provider: { type: integer, description: "kinds user, group, any-user" }
        sub: { type: string }
        group: { type: string }
    VPNRoute:
      type: object
      properties:
        cidr: { type: string, description: IPv4 prefix in private address space }
        proto: { type: string, enum: [tcp, udp, any] }
        ports: { type: string, description: '"" = all, else like 22,443,8000-8100' }
    VPNPolicy:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { $ref: '#/components/schemas/VPNSubject' }
        routes: { type: array, items: { $ref: '#/components/schemas/VPNRoute' } }
    Error:
      type: object
      properties:
        error: { type: string }
    Upstream:
      type: object
      properties:
        scheme: { type: string, enum: [http, https] }
        host: { type: string }
        port: { type: integer }
    PathRewrite:
      type: object
      properties:
        stripPrefix: { type: string }
        addPrefix: { type: string }
        regex: { type: string, description: RE2 }
        replacement: { type: string }
    Location:
      type: object
      properties:
        path: { type: string, description: matched as a prefix, longest wins }
        upstream: { $ref: '#/components/schemas/Upstream' }
        pathRewrite: { $ref: '#/components/schemas/PathRewrite' }
    Host:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [proxy, redirect, dead, static] }
        domains: { type: array, items: { type: string } }
        upstream: { $ref: '#/components/schemas/Upstream' }
        upstreams: { type: array, items: { $ref: '#/components/schemas/Upstream' } }
        locations: { type: array, items: { $ref: '#/components/schemas/Location' } }
        staticRoot: { type: string }
        redirect:
          type: object
          properties:
            httpCode: { type: integer, enum: [300, 301, 302, 307, 308] }
            targetScheme: { type: string, enum: [auto, http, https] }
            targetHost: { type: string }
            preservePath: { type: boolean }
        certMode: { type: string, enum: [auto, custom, none] }
        certId: { type: integer, nullable: true }
        forceSsl: { type: boolean }
        enabled: { type: boolean }
        accessListId: { type: integer, nullable: true }
        options: { type: object, description: typed advanced options (headers, timeouts, hsts, rateLimit, forwardAuth, oidc, authRules, clientCert, pathRewrite, blockExploits, blockBadBots, compression, badGatewayHtml, ...) }
    OIDCProvider:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        issuer: { type: string, description: OIDC discovery base URL }
        clientId: { type: string }
        clientSecret: { type: string, description: write-mostly, masked in responses }
        scopes: { type: array, items: { type: string }, description: "default: openid email profile" }
        groupsClaim: { type: string, description: "ID-token claim holding groups (default: groups)" }
        sessionHours: { type: integer, description: "session cookie lifetime (default: 12)" }
        skipTlsVerify: { type: boolean }
    AccessList:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        satisfy: { type: string, enum: [any, all] }
        passAuth: { type: boolean }
        rules:
          type: array
          items:
            type: object
            properties:
              action: { type: string, enum: [allow, deny] }
              cidr: { type: string }
              host: { type: string, description: hostname, re-resolved (dynamic DNS) }
              country: { type: string, description: ISO 3166-1 alpha-2 (GeoIP) }
              methods:
                type: array
                items: { type: string }
                description: "HTTP verbs this rule applies to (e.g. [POST, PUT, DELETE]); empty = all methods"
        users:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              password: { type: string, description: write-only; omit to keep existing }
    Stream:
      type: object
      properties:
        id: { type: integer }
        listenPort: { type: integer }
        listenPortEnd: { type: integer, description: ">0 for a TCP port range" }
        protocol: { type: string, enum: [tcp, udp, both] }
        forwardHost: { type: string }
        forwardPort: { type: integer }
        allowedCidrs: { type: array, items: { type: string } }
        accessListId: { type: integer, description: "reuse an access list's allow CIDR/host rules as the source filter instead of allowedCidrs" }
        sendProxyProtocol: { type: string, enum: ["", v1, v2] }
        acceptProxyProtocol: { type: boolean }
        terminateTls: { type: boolean }
        certId: { type: integer, nullable: true }
        sniRoutes:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              forwardHost: { type: string }
              forwardPort: { type: integer }
        enabled: { type: boolean }
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /api/login:
    post:
      summary: Log in
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                code: { type: string, description: TOTP code when 2FA is enabled }
      responses:
        "200": { description: "session set, or {totpRequired:true}" }
        "401": { description: invalid credentials }
  /api/logout:
    post: { summary: Log out, responses: { "200": { description: ok } } }
  /api/me:
    get: { summary: Current user, responses: { "200": { description: "{email, mustChange, totpEnabled}" } } }
  /api/password:
    post:
      summary: Change password
      requestBody:
        content: { application/json: { schema: { type: object, properties: { current: {type: string}, new: {type: string} } } } }
      responses: { "200": { description: ok } }
  /api/2fa/setup:
    post: { summary: Begin 2FA setup, responses: { "200": { description: "{secret, uri}" } } }
  /api/2fa/enable:
    post: { summary: Enable 2FA, responses: { "200": { description: enabled } } }
  /api/2fa/disable:
    post: { summary: Disable 2FA, responses: { "200": { description: disabled } } }
  /api/hosts:
    get:
      summary: List hosts
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Host' } } } } }
    post:
      summary: Create host
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Host' } } } }
      responses: { "201": { description: created }, "400": { description: invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /api/hosts/{id}:
    put:
      summary: Update host
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Host' } } } }
      responses: { "200": { description: ok } }
    delete:
      summary: Delete host
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: deleted } }
  /api/health:
    get: { summary: Upstream health, responses: { "200": { description: "[{target, up, lastErr}]" } } }
  /api/access-lists:
    get:
      summary: List access lists
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AccessList' } } } } } }
    post:
      summary: Create access list
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AccessList' } } } }
      responses: { "201": { description: created } }
  /api/access-lists/{id}:
    put:
      summary: Update access list
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AccessList' } } } }
      responses: { "200": { description: ok } }
    delete:
      summary: Delete access list
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: deleted } }
  /api/oidc-providers:
    get:
      summary: List OIDC identity providers (client secrets masked)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OIDCProvider' } } } } } }
    post:
      summary: Create OIDC identity provider
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OIDCProvider' } } } }
      responses: { "201": { description: created } }
  /api/oidc-providers/{id}:
    put:
      summary: Update OIDC identity provider (empty or masked clientSecret keeps the stored one)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OIDCProvider' } } } }
      responses: { "200": { description: ok } }
    delete:
      summary: Delete OIDC identity provider (rejected while a host references it)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: deleted } }
  /api/streams:
    get:
      summary: List streams
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Stream' } } } } } }
    post:
      summary: Create stream
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Stream' } } } }
      responses: { "201": { description: created } }
  /api/streams/{id}:
    put:
      summary: Update stream
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Stream' } } } }
      responses: { "200": { description: ok } }
    delete:
      summary: Delete stream
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: deleted } }
  /api/wg/status:
    get: { summary: "WireGuard endpoint status: running, port, tunnel network, public key, per-site and per-device handshake and traffic. Never a private or preshared key.", responses: { "200": { description: OK } } }
  /api/wg/sites:
    get: { summary: List WireGuard sites (without preshared keys), responses: { "200": { description: OK } } }
    post:
      summary: Create a site. The response carries the preshared key, this once.
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, publicKey: {type: string}, networks: {type: array, items: {type: string}}, endpoint: {type: string}, keepalive: {type: integer}, enabled: {type: boolean}, allowOwnOverlap: {type: boolean} } } } } }
      responses: { "201": { description: created }, "400": { description: refused by validation } }
  /api/wg/sites/{id}:
    put: { summary: "Update a site (the key and the address cannot change)", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { "200": { description: ok } } }
    delete: { summary: "Delete a site; 409 while a host or stream still reaches something through it", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { "204": { description: deleted }, "409": { description: in use } } }
  /api/wg/devices:
    get: { summary: "List VPN devices, revoked ones included (without preshared keys)", responses: { "200": { description: OK } } }
    post:
      summary: Add a device that reaches quicgate's hosts in the tunnel. The response carries the preshared key, this once.
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, publicKey: {type: string} } } } } }
      responses: { "201": { description: created } }
  /api/wg/devices/{id}/enabled:
    put: { summary: Switch a device off or on, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], requestBody: { content: { application/json: { schema: { type: object, properties: { enabled: {type: boolean} } } } } }, responses: { "204": { description: ok } } }
  /api/wg/devices/{id}:
    delete: { summary: "Revoke a device. Final: the key can never be registered again.", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { "204": { description: revoked } } }
  /api/wg/breakglass:
    post:
      summary: Add a break-glass device (LAN routes without a login). Needs the admin's password and a TOTP code; at most two exist.
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, publicKey: {type: string}, password: {type: string}, code: {type: string}, routes: {type: array, items: { $ref: '#/components/schemas/VPNRoute' }}, expiresAt: {type: string, format: date-time}, neverExpires: {type: boolean} } } } } }
      responses: { "201": { description: created }, "401": { description: wrong password or code } }
  /api/wg/policies:
    get: { summary: List LAN policies, responses: { "200": { description: OK } } }
    post: { summary: Create a LAN policy, requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VPNPolicy' } } } }, responses: { "200": { description: ok } } }
  /api/wg/policies/{id}:
    put: { summary: Update a LAN policy, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VPNPolicy' } } } }, responses: { "200": { description: ok } } }
    delete: { summary: Delete a LAN policy, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { "204": { description: deleted } } }
  /api/wg/explain:
    post: { summary: "Would these routes let a device reach a destination, and if not, why", requestBody: { content: { application/json: { schema: { type: object, properties: { routes: {type: array, items: { $ref: '#/components/schemas/VPNRoute' }}, proto: {type: string, enum: [tcp, udp]}, dest: {type: string, example: "192.168.1.10:443"} } } } } }, responses: { "200": { description: "{answer}" } } }
  /api/wg/sessions:
    get: { summary: "People who logged in at a VPN portal, with their lease. Never a refresh token.", responses: { "200": { description: OK } } }
  /api/wg/sessions/{id}/end:
    post: { summary: End a person's login now; their devices stop until they log in again, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { "204": { description: ended } } }
  /api/wg/blocked:
    get: { summary: List blocked owners, responses: { "200": { description: OK } } }
  /api/wg/owners/block:
    post: { summary: "Block a person from the VPN; a login does not undo it", requestBody: { content: { application/json: { schema: { type: object, properties: { provider: {type: integer}, sub: {type: string}, email: {type: string} } } } } }, responses: { "204": { description: blocked } } }
  /api/wg/owners/unblock:
    post: { summary: Lift a block, requestBody: { content: { application/json: { schema: { type: object, properties: { provider: {type: integer}, sub: {type: string} } } } } }, responses: { "204": { description: lifted } } }
  /api/certs:
    get: { summary: Managed (ACME) cert status, responses: { "200": { description: "[{domain, status, notAfter, lastError, errorAt}]" } } }
  /api/custom-certs:
    get: { summary: List uploaded certs, responses: { "200": { description: OK } } }
    post:
      summary: Upload a cert
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, certPem: {type: string}, keyPem: {type: string} } } } } }
      responses: { "201": { description: created } }
  /api/custom-certs/{id}:
    put:
      summary: Replace cert in place
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: ok } }
    delete:
      summary: Delete cert
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: deleted } }
  /api/custom-certs/self-signed:
    post:
      summary: Generate a self-signed cert
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, domains: {type: array, items: {type: string}}, days: {type: integer} } } } } }
      responses: { "201": { description: created } }
  /api/custom-certs/from-file:
    post:
      summary: Import a cert from server-local files
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string}, certPath: {type: string}, keyPath: {type: string} } } } } }
      responses: { "201": { description: created } }
  /api/settings:
    get: { summary: Get settings (closed key set), responses: { "200": { description: OK } } }
    put:
      summary: Update settings (merge; unknown keys rejected)
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: { type: string } } } } }
      responses: { "200": { description: ok } }
  /api/notify-test:
    post: { summary: Send a test webhook alert, responses: { "200": { description: sent } } }
  /api/tokens:
    get: { summary: List API tokens, responses: { "200": { description: OK } } }
    post:
      summary: Create an API token (returns raw token once)
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: {type: string} } } } } }
      responses: { "201": { description: "{id, name, token}" } }
  /api/tokens/{id}:
    delete:
      summary: Revoke token
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: deleted } }
  /api/config:
    get: { summary: Effective (applied) routing table, responses: { "200": { description: "[{domain, type, target, wildcard}]" } } }
  /api/logs:
    get:
      summary: Recent access-log lines (newest first)
      parameters: [ { name: n, in: query, schema: { type: integer, maximum: 2000 } } ]
      responses: { "200": { description: OK } }
  /api/bans:
    get: { summary: Addresses auto-ban is refusing now, with the host and reason, responses: { "200": { description: "[{ip, country, since, until, failures, host, reason}]" } } }
  /api/bans/{ip}:
    delete:
      summary: Lift the ban on an address
      parameters: [ { name: ip, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: unbanned }, "400": { description: not an IP address }, "404": { description: not banned } }
  /api/traffic:
    get:
      summary: Traffic history for the overview charts
      parameters: [ { name: range, in: query, schema: { type: string, enum: ["1h", "6h", "24h", "7d"], default: "1h" } } ]
      responses:
        "200": { description: "{range, step, start, lastSpan, series, totals, ports[], hosts[], countries[], geoip, open, banned}; series values are per point, null where there is no data" }
        "400": { description: unknown range }
  /api/backup:
    get: { summary: Download a full backup (tar.gz), responses: { "200": { description: "application/gzip" } } }
  /api/restore:
    post: { summary: Restore from a backup tar.gz (replaces everything), responses: { "200": { description: restored } } }
  /api/import:
    post:
      summary: Declarative import (additive)
      requestBody: { content: { application/json: { schema: { type: object, properties: { accessLists: {type: array}, hosts: {type: array}, streams: {type: array} } } } } }
      responses: { "200": { description: "{hosts, accessLists, streams} counts" } }
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses: { "200": { description: "text/plain exposition" } }
